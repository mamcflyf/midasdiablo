name: Sync with header

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Show files (debug)
        run: |
          echo "=== FILES ==="
          ls -la

      - name: Ensure header exists
        run: |
          if [ ! -f header.txt ]; then
            echo "header.txt not found"
            exit 1
          fi

      - name: Download external file (safe)
        run: |
          curl -fsSL https://raw.githubusercontent.com/zieng2/wl/main/vless_lite.txt -o external.txt || {
            echo "Download failed, skip update"
            exit 0
          }

          if [ ! -s external.txt ]; then
            echo "Downloaded file is empty, skip"
            exit 0
          fi

      - name: Merge files
        run: |
          cat header.txt external.txt > combined.txt

      - name: Update only if changed
        run: |
          if [ ! -f vless_lite.txt ]; then
            mv combined.txt vless_lite.txt
            echo "changed=true" >> $GITHUB_ENV
            exit 0
          fi

          if cmp -s combined.txt vless_lite.txt; then
            echo "No changes"
            rm combined.txt
          else
            mv combined.txt vless_lite.txt
            echo "changed=true" >> $GITHUB_ENV
          fi

      - name: Commit
        if: env.changed == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add vless_lite.txt
          git commit -m "auto: update list"
          git push
